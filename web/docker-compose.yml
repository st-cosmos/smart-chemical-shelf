version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart-shelf-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_shelf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-shelf-web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smart_shelf
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
